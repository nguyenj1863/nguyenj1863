name: Refresh GitHub profile charts

on:
  workflow_dispatch:
  schedule:
    - cron: '19 7 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_stats.py'
      - '.github/workflows/refresh-stats.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build SVG graphs from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: nguyenj1863
        run: python scripts/generate_stats.py
      - name: Commit generated charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg assets/contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh GitHub profile charts [skip ci]"
            git push
          fi
